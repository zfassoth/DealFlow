name: DealFlow Follow-up Notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wake DealFlow and send due notifications
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "x-dealflow-secret: ${{ secrets.DEALFLOW_NOTIFY_SECRET }}" \
            "https://dealflow-0ejh.onrender.com/api/notifications/run"
